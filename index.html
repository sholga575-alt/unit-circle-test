<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тренажер: Единичная окружность</title>
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']]
            },
            startup: {
                pageReady: () => {
                    return MathJax.startup.defaultPageReady();
                }
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            line-height: 1.6;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            color: #333;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 20px;
        }
        .question-block {
            margin-bottom: 25px;
            padding: 15px;
            background: #f9f9f9;
            border-radius: 8px;
        }
        .question-text {
            font-weight: 600;
            margin-bottom: 10px;
        }
        .option-label {
            display: block;
            margin: 8px 0;
            cursor: pointer;
        }
        .option-label input {
            margin-right: 10px;
        }
        button {
            padding: 10px 20px;
            font-size: 1rem;
            background: #0056b3;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background: #004494;
        }
        #results {
            margin-top: 30px;
            padding: 20px;
            background: #eef;
            border-radius: 8px;
            display: none;
        }
        #results h2 {
            margin-top: 0;
        }
    </style>
</head>
<body>

    <h1>Проверочный тест: Единичная окружность и радианы</h1>
    <div id="quiz-container"></div>
    <button id="submit-btn" onclick="checkAnswers()">Проверить ответы</button>
    
    <div id="results">
        <h2>Результат</h2>
        <p id="correct-count"></p>
        <p id="incorrect-count"></p>
    </div>

    <script>
        const allQuestions = [
            {q: "Чему равен радиус единичной окружности?", opts: ["0", "1", "2", "$\\pi$"], correct: 1},
            {q: "В какой точке находится центр единичной окружности?", opts: ["(1; 0)", "(0; 1)", "(0; 0)", "(-1; 0)"], correct: 2},
            {q: "Какая точка является начальной для отсчета углов?", opts: ["(1; 0)", "(0; 1)", "(-1; 0)", "(0; -1)"], correct: 0},
            {q: "Какое направление считается положительным?", opts: ["По часовой стрелке", "Против часовой стрелки", "Вдоль оси ординат", "Вдоль оси абсцисс"], correct: 1},
            {q: "Какое направление считается отрицательным?", opts: ["По часовой стрелке", "Против часовой стрелки", "От центра к краям", "По спирали"], correct: 0},
            {q: "Что такое 1 радиан?", opts: ["Угол, равный 60 градусам", "Центральный угол, опирающийся на дугу, равную радиусу", "Угол на всю окружность", "Половина прямого угла"], correct: 1},
            {q: "Чему примерно равен 1 радиан в градусах?", opts: ["45°", "60°", "57°", "90°"], correct: 2},
            {q: "Чему равна длина полной окружности в радианах?", opts: ["$\\pi$", "$2\\pi$", "$3\\pi$", "$4\\pi$"], correct: 1},
            {q: "Как перевести градусы в радианы?", opts: ["Умножить на $180/\\pi$", "Умножить на $\\pi/180$", "Разделить на 360", "Умножить на 57"], correct: 1},
            {q: "Как перевести радианы в градусы?", opts: ["Умножить на $180/\\pi$", "Умножить на $\\pi/180$", "Умножить на $\\pi$", "Разделить на 2"], correct: 0},
            {q: "Чему равны 30° в радианах?", opts: ["$\\pi/2$", "$\\pi/3$", "$\\pi/6$", "$\\pi/4$"], correct: 2},
            {q: "Чему равны 45° в радианах?", opts: ["$\\pi/6$", "$\\pi/4$", "$\\pi/3$", "$\\pi/2$"], correct: 1},
            {q: "Чему равны 60° в радианах?", opts: ["$\\pi/2$", "$\\pi/3$", "$\\pi/4$", "$\\pi/6$"], correct: 1},
            {q: "Чему равны 90° в радианах?", opts: ["$\\pi/3$", "$\\pi/2$", "$\\pi$", "$2\\pi$"], correct: 1},
            {q: "Чему равны 120° в радианах?", opts: ["$\\pi/3$", "$2\\pi/3$", "$3\\pi/4$", "$5\\pi/6$"], correct: 1},
            {q: "Чему равны 135° в радианах?", opts: ["$2\\pi/3$", "$3\\pi/4$", "$5\\pi/6$", "$7\\pi/6$"], correct: 1},
            {q: "Чему равны 150° в радианах?", opts: ["$\\pi/2$", "$2\\pi/3$", "$5\\pi/6$", "$7\\pi/6$"], correct: 2},
            {q: "Чему равны 180° в радианах?", opts: ["$\\pi/2$", "$\\pi$", "$2\\pi$", "$3\\pi$"], correct: 1},
            {q: "Чему равны 210° в радианах?", opts: ["$5\\pi/6$", "$7\\pi/6$", "$4\\pi/3$", "$3\\pi/2$"], correct: 1},
            {q: "Чему равны 225° в радианах?", opts: ["$4\\pi/3$", "$5\\pi/4$", "$3\\pi/2$", "$7\\pi/4$"], correct: 1},
            {q: "Чему равны 240° в радианах?", opts: ["$5\\pi/6$", "$7\\pi/6$", "$4\\pi/3$", "$3\\pi/2$"], correct: 2},
            {q: "Чему равны 270° в радианах?", opts: ["$\\pi$", "$4\\pi/3$", "$3\\pi/2$", "$5\\pi/3$"], correct: 2},
            {q: "Чему равны 300° в радианах?", opts: ["$4\\pi/3$", "$3\\pi/2$", "$5\\pi/3$", "$11\\pi/6$"], correct: 2},
            {q: "Чему равны 330° в радианах?", opts: ["$5\\pi/3$", "$11\\pi/6$", "$2\\pi$", "$7\\pi/6$"], correct: 1},
            {q: "Чему равны 360° в радианах?", opts: ["$\\pi$", "$3\\pi/2$", "$2\\pi$", "$4\\pi$"], correct: 2},
            {q: "Чему равны $\\pi/6$ в градусах?", opts: ["30°", "45°", "60°", "90°"], correct: 0},
            {q: "Чему равны $\\pi/4$ в градусах?", opts: ["30°", "45°", "60°", "90°"], correct: 1},
            {q: "Чему равны $\\pi/3$ в градусах?", opts: ["30°", "45°", "60°", "90°"], correct: 2},
            {q: "Чему равны $\\pi/2$ в градусах?", opts: ["45°", "60°", "90°", "180°"], correct: 2},
            {q: "Чему равны $2\\pi/3$ в градусах?", opts: ["60°", "90°", "120°", "150°"], correct: 2},
            {q: "Чему равны $3\\pi/4$ в градусах?", opts: ["90°", "120°", "135°", "150°"], correct: 2},
            {q: "Чему равны $5\\pi/6$ в градусах?", opts: ["120°", "150°", "180°", "210°"], correct: 1},
            {q: "Чему равны $\\pi$ в градусах?", opts: ["90°", "135°", "180°", "360°"], correct: 2},
            {q: "Чему равны $7\\pi/6$ в градусах?", opts: ["150°", "180°", "210°", "240°"], correct: 2},
            {q: "Чему равны $5\\pi/4$ в градусах?", opts: ["180°", "210°", "225°", "240°"], correct: 2},
            {q: "Чему равны $4\\pi/3$ в градусах?", opts: ["210°", "240°", "270°", "300°"], correct: 1},
            {q: "Чему равны $3\\pi/2$ в градусах?", opts: ["180°", "240°", "270°", "360°"], correct: 2},
            {q: "Чему равны $5\\pi/3$ в градусах?", opts: ["240°", "270°", "300°", "330°"], correct: 2},
            {q: "В какой четверти угол 30°?", opts: ["I", "II", "III", "IV"], correct: 0},
            {q: "В какой четверти угол 120°?", opts: ["I", "II", "III", "IV"], correct: 1},
            {q: "В какой четверти угол 210°?", opts: ["I", "II", "III", "IV"], correct: 2},
            {q: "В какой четверти угол 300°?", opts: ["I", "II", "III", "IV"], correct: 3},
            {q: "В какой четверти угол $\\pi/4$?", opts: ["I", "II", "III", "IV"], correct: 0},
            {q: "В какой четверти угол $3\\pi/4$?", opts: ["I", "II", "III", "IV"], correct: 1},
            {q: "В какой четверти угол $5\\pi/4$?", opts: ["I", "II", "III", "IV"], correct: 2},
            {q: "В какой четверти угол $7\\pi/4$?", opts: ["I", "II", "III", "IV"], correct: 3},
            {q: "С какой точкой совпадает поворот на 400°?", opts: ["80°", "40°", "360°", "0°"], correct: 1},
            {q: "С какой точкой совпадает поворот на -90°?", opts: ["90°", "180°", "270°", "360°"], correct: 2},
            {q: "С какой точкой совпадает поворот на $3\\pi$?", opts: ["0", "$\\pi$", "$2\\pi$", "$\\pi/2$"], correct: 1},
            {q: "Формула периодичности в градусах?", opts: ["$\\alpha + 180^\\circ \\cdot n$", "$\\alpha + 360^\\circ \\cdot n$", "$\\alpha + 90^\\circ \\cdot n$", "$\\alpha + 2\\pi \\cdot n$"], correct: 1}
        ];

        let currentQuiz = [];

        function getRandomQuestions(arr, num) {
            const shuffled = [...arr].sort(() => 0.5 - Math.random());
            return shuffled.slice(0, num);
        }

        function renderQuiz() {
            currentQuiz = getRandomQuestions(allQuestions, 10);
            const container = document.getElementById('quiz-container');
            container.innerHTML = '';
            
            currentQuiz.forEach((item, index) => {
                let html = `<div class="question-block">
                    <p class="question-text">${index + 1}. ${item.q}</p>`;
                
                item.opts.forEach((opt, optIndex) => {
                    html += `
                        <label class="option-label">
                            <input type="radio" name="q${index}" value="${optIndex}">
                            <span>${opt}</span>
                        </label>`;
                });
                
                html += `</div>`;
                container.innerHTML += html;
            });
            
            if (window.MathJax && window.MathJax.typesetPromise) {
                MathJax.typesetPromise();
            }
        }

        function checkAnswers() {
            let correctCount = 0;
            let incorrectCount = 0;
            
            currentQuiz.forEach((item, index) => {
                const selected = document.querySelector(`input[name="q${index}"]:checked`);
                if (selected && parseInt(selected.value) === item.correct) {
                    correctCount++;
                } else {
                    incorrectCount++;
                }
            });
            
            document.getElementById('correct-count').textContent = `Правильных ответов: ${correctCount}`;
            document.getElementById('incorrect-count').textContent = `Неправильных ответов (или без ответа): ${incorrectCount}`;
            document.getElementById('results').style.display = 'block';
            document.getElementById('submit-btn').disabled = true;
        }

        document.addEventListener('DOMContentLoaded', renderQuiz);
    </script>
</body>
</html>
